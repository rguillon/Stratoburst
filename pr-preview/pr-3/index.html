  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="loading">
        <div class="title">SCORCHED</div>
        <div id="progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill"></div>
        </div>
        <p id="loading-status" role="status">Loading Python runtime…</p>
        <button id="start-gate" type="button" hidden>TAP / CLICK TO START</button>
      </div>
      <div id="status-readout" hidden>
        <div class="hud-top"><span class="score"></span><span class="hi"><span class="hi-label">HI</span> <span class="hiscore"></span></span></div>
        <div class="hud-bl"><span class="lives"></span><span class="bombs"></span></div>
        <div class="hud-br"><span class="weapon"></span><span class="level"></span></div>
      </div>
      <div id="popups"></div>
      <div id="boss-bar" hidden><div class="fill"></div><div class="ticks"></div><span class="timer" hidden></span></div>
      <div id="max-flash" hidden>MAX</div>
      <div id="banner" hidden></div>
      <div id="extend" hidden>EXTEND</div>
      <div id="tally" hidden>
        <div class="title">STAGE BONUS</div>
        <div class="row" id="tally-boss" hidden><span class="label">BOSS DESTROYED</span><span class="amount"></span></div>
        <div class="row" id="tally-medals" hidden><span class="label">MEDALS</span><span class="amount"></span></div>
        <div class="row" id="tally-no-miss" hidden><span class="label">NO MISS</span><span class="amount"></span></div>
        <div class="row" id="tally-bombs" hidden><span class="label">BOMBS LEFT</span><span class="amount"></span></div>
      </div>
      <button id="bomb-button" type="button" aria-label="Bomb" data-no-steer hidden>B</button>
    </div>
    <div id="game-over" role="dialog" aria-label="Game over" data-no-steer hidden>
      <div class="title">GAME OVER</div>
      <div class="final"></div>
      <div class="best-line">BEST <span class="best"></span></div>
      <div class="record" hidden>NEW RECORD</div>
      <div class="hint">PRESS FIRE OR TAP</div>
    </div>
    <div id="paused" role="dialog" aria-label="Game paused" hidden>
      <div class="title">PAUSED</div>
      <div class="hint">tap or press any key to resume</div>
    </div>
