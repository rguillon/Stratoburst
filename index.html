<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scorched</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07061a;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        height: 100dvh;
        touch-action: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      canvas#view {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #07061a;
        color: #e6ebff;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      #loading[hidden] {
        display: none;
      }
      #loading .title {
        font-size: clamp(40px, 12vmin, 112px);
        font-weight: 800;
        letter-spacing: 0.22em;
        color: rgb(27, 215, 255);
        text-shadow: 0 0 18px rgba(27, 215, 255, 0.55);
        text-indent: 0.22em;
      }
      #progress {
        position: relative;
        width: min(70vw, 360px);
        height: 10px;
        border: 1px solid rgb(27, 215, 255);
        border-radius: 2px;
        overflow: hidden;
      }
      #progress-fill {
        height: 100%;
        width: 0%;
        background: rgb(255, 30, 225);
        transition: width 0.15s linear;
      }
      #progress.indeterminate #progress-fill {
        width: 35%;
        transition: none;
        animation: loading-sweep 1.1s ease-in-out infinite alternate;
      }
      @keyframes loading-sweep {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(185%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #progress.indeterminate #progress-fill {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
      #loading-status {
        margin: 0;
        font-size: clamp(14px, 3.2vmin, 22px);
        opacity: 0.85;
      }
      #start-gate {
        min-height: 56px;
        padding: 14px 28px;
        border: 2px solid rgb(27, 215, 255);
        border-radius: 4px;
        background: transparent;
        color: rgb(27, 215, 255);
        font: 700 clamp(18px, 4.5vmin, 30px) system-ui, sans-serif;
        letter-spacing: 0.12em;
        cursor: pointer;
        touch-action: manipulation;
      }
      #start-gate[hidden] {
        display: none;
      }
      #start-gate:hover,
      #start-gate:focus-visible {
        background: rgb(255, 30, 225);
        border-color: rgb(255, 30, 225);
        color: #07061a;
        outline: none;
      }
      #status-readout {
        position: absolute;
        left: calc(env(safe-area-inset-left, 0px) + 10px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
        z-index: 4;
        pointer-events: none;
        font: 700 13px/1.2 ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        color: #e6ebff;
        text-shadow: 0 0 3px #000, 0 0 6px #000;
        user-select: none;
      }
      #status-readout[hidden] {
        display: none;
      }
      /* The bomb pickup's acid green (PALETTE.BOMB_PICKUP 0.8, 3.6, 0.5 scaled so its largest channel
         is 255). Orange-yellow belongs to enemy bullets alone (D-39). */
      #status-readout .bombs {
        color: rgb(57, 255, 35);
        letter-spacing: 0.25em;
      }
      #max-flash {
        position: absolute;
        left: 0;
        right: 0;
        top: 24%;
        z-index: 4;
        pointer-events: none;
        text-align: center;
        font: 900 clamp(48px, 14vmin, 128px) / 1 system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        color: #ffffff;
        text-shadow:
          0 0 10px rgb(27, 215, 255),
          0 0 28px rgb(27, 215, 255),
          0 0 56px rgba(27, 215, 255, 0.7),
          0 2px 0 #06303a;
        user-select: none;
      }
      #max-flash[hidden] {
        display: none;
      }
      /* The touch bomb button (INPT-03): the bomb pickup's acid green, never orange-yellow. data-no-steer keeps
         touch_input from treating a press on it as a drag. */
      #bomb-button {
        position: fixed;
        right: calc(16px + env(safe-area-inset-right, 0px));
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: center;
        width: clamp(72px, 15vmin, 112px);
        height: clamp(72px, 15vmin, 112px);
        padding: 0;
        border: 3px solid rgba(57, 255, 35, 0.85);
        border-radius: 50%;
        background: rgba(57, 255, 35, 0.28);
        color: rgba(190, 255, 180, 0.95);
        font: 900 clamp(28px, 6vmin, 44px) / 1 system-ui, sans-serif;
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #bomb-button[hidden] {
        display: none;
      }
      #bomb-button:active {
        background: rgba(57, 255, 35, 0.55);
      }
      #paused {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(7, 6, 26, 0.72);
        color: #e6ebff;
        font-family: system-ui, sans-serif;
        text-align: center;
        user-select: none;
        touch-action: none;
        cursor: pointer;
      }
      #paused[hidden] {
        display: none;
      }
      #paused .title {
        font-size: clamp(36px, 10vmin, 96px);
        font-weight: 800;
        letter-spacing: 0.2em;
        color: rgb(255, 30, 225);
      }
      #paused .hint {
        font-size: clamp(14px, 3.2vmin, 24px);
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="loading">
        <div class="title">SCORCHED</div>
        <div id="progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill"></div>
        </div>
        <p id="loading-status" role="status">Loading Python runtime…</p>
        <button id="start-gate" type="button" hidden>TAP / CLICK TO START</button>
      </div>
      <div id="status-readout" hidden><span class="weapon"></span> <span class="level"></span> <span class="bombs"></span></div>
      <div id="max-flash" hidden>MAX</div>
      <button id="bomb-button" type="button" aria-label="Bomb" data-no-steer hidden>B</button>
    </div>
    <div id="paused" role="dialog" aria-label="Game paused" hidden>
      <div class="title">PAUSED</div>
      <div class="hint">tap or press any key to resume</div>
    </div>
    <script type="module" src="/web/src/main.js"></script>
  </body>
</html>
