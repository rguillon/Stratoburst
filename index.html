<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scorched</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0a09;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        height: 100dvh;
        touch-action: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      canvas#view {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0b0a09;
        color: #f2e8d5;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      #loading[hidden] {
        display: none;
      }
      #loading .title {
        font-size: clamp(40px, 12vmin, 112px);
        font-weight: 800;
        letter-spacing: 0.22em;
        color: #ff8a3d;
        text-indent: 0.22em;
      }
      #progress {
        position: relative;
        width: min(70vw, 360px);
        height: 10px;
        border: 1px solid #ff8a3d;
        border-radius: 2px;
        overflow: hidden;
      }
      #progress-fill {
        height: 100%;
        width: 0%;
        background: #ffb347;
        transition: width 0.15s linear;
      }
      #progress.indeterminate #progress-fill {
        width: 35%;
        transition: none;
        animation: loading-sweep 1.1s ease-in-out infinite alternate;
      }
      @keyframes loading-sweep {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(185%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #progress.indeterminate #progress-fill {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
      #loading-status {
        margin: 0;
        font-size: clamp(14px, 3.2vmin, 22px);
        opacity: 0.85;
      }
      #start-gate {
        min-height: 56px;
        padding: 14px 28px;
        border: 2px solid #ff8a3d;
        border-radius: 4px;
        background: transparent;
        color: #ffb347;
        font: 700 clamp(18px, 4.5vmin, 30px) system-ui, sans-serif;
        letter-spacing: 0.12em;
        cursor: pointer;
        touch-action: manipulation;
      }
      #start-gate[hidden] {
        display: none;
      }
      #start-gate:hover,
      #start-gate:focus-visible {
        background: #ff8a3d;
        color: #0b0a09;
        outline: none;
      }
      #status-readout {
        position: absolute;
        left: calc(env(safe-area-inset-left, 0px) + 10px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
        z-index: 4;
        pointer-events: none;
        font: 700 13px/1.2 ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        color: #f2e8d5;
        text-shadow: 0 0 3px #000, 0 0 6px #000;
        user-select: none;
      }
      #status-readout[hidden] {
        display: none;
      }
      #paused {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(11, 10, 9, 0.72);
        color: #f2e8d5;
        font-family: system-ui, sans-serif;
        text-align: center;
        user-select: none;
        touch-action: none;
        cursor: pointer;
      }
      #paused[hidden] {
        display: none;
      }
      #paused .title {
        font-size: clamp(36px, 10vmin, 96px);
        font-weight: 800;
        letter-spacing: 0.2em;
        color: #ff8a3d;
      }
      #paused .hint {
        font-size: clamp(14px, 3.2vmin, 24px);
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="loading">
        <div class="title">SCORCHED</div>
        <div id="progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill"></div>
        </div>
        <p id="loading-status" role="status">Loading Python runtime…</p>
        <button id="start-gate" type="button" hidden>TAP / CLICK TO START</button>
      </div>
      <div id="status-readout" hidden><span class="weapon"></span> <span class="level"></span></div>
    </div>
    <div id="paused" role="dialog" aria-label="Game paused" hidden>
      <div class="title">PAUSED</div>
      <div class="hint">tap or press any key to resume</div>
    </div>
    <script type="module" src="/web/src/main.js"></script>
  </body>
</html>
